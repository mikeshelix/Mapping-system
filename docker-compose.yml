# Local development database only. Production runs on Helixco's own servers.
services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: hazard
      POSTGRES_PASSWORD: hazard_dev
      POSTGRES_DB: hazard
    ports:
      - "5433:5432"
    volumes:
      - hazard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hazard -d hazard"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  hazard_pg:
